services:
  postgres:
    image: postgres:16
    container_name: pep-postgres
    environment:
      POSTGRES_DB: pep_patient
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pep_patient"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pep-network

  mongo:
    image: mongo:7
    container_name: pep-mongo
    environment:
      MONGO_INITDB_DATABASE: pep_clinical
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pep-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pep-rabbitmq
    ports:
      - "5672:5672"   # Porta AMQP (comunicação dos serviços)
      - "15672:15672" # Painel Web (guest / guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pep-network

  redis:
    image: redis:7
    container_name: pep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pep-network

  # =====================================================================
  # SERVIÇOS DA APLICAÇÃO (Serão ativados na Fase 5 - DevOps)
