$kind: http-request
method: GET
url: '{{base_url}}/api/v1/registros-clinicos/paciente/:pacienteId?page=0&size=20&sort=dataRegistro,desc'
order: 2000
pathVariables:
  - key: pacienteId
    value: '{{patient_id}}'
queryParams:
  - key: page
    value: '0'
  - key: size
    value: '20'
  - key: sort
    value: 'dataRegistro,desc'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
