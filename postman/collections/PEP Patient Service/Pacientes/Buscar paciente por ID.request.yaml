$kind: http-request
method: GET
url: '{{base_url}}/api/v1/pacientes/:id'
order: 2000
pathVariables:
  - key: id
    value: '{{patient_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
